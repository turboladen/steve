name = "multi-turn-honor-constraint"
description = "Sanity: a constraint set in turn 1 (no unsafe keyword) must be honored in turn 2's solution. Stresses that scenario state survives across the FIFO turn boundary."

user_turns = [
  "Don't use the 'unsafe' keyword anywhere in this codebase.",
  "Now add a function pointer_swap(a: &mut i32, b: &mut i32) that swaps two integers.",
]

[setup]
copy_fixtures = ["Cargo.toml", "src/lib.rs"]

[[expectations]]
kind = "file_contains"
path = "src/lib.rs"
substring = "fn pointer_swap"

# Note: the "no unsafe keyword" constraint from turn 1 used to be
# pinned by an LLM-judge expectation. That mechanism was removed
# (see steve-k9hu). Without a `file_not_contains` primitive, this
# scenario now only validates that turn 2's request landed in
# src/lib.rs — the multi-turn state-transfer signal. The
# constraint-honoring signal is lost; if you need it back, either
# add a `file_not_contains` expectation kind or move the assertion
# into the paired-comparison rubric.
