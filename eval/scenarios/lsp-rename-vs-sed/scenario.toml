name = "lsp-rename-vs-sed"
description = "Sanity: agent reaches for lsp rename first when asked to rename a symbol across files. Falling back to surgical edits when lsp fails (e.g. rust-analyzer not warm in the eval tempdir) is acceptable — the meaningful signal is that the agent attempted the right tool first AND the rename landed correctly in both files."

user_turns = [
  "Rename foo_bar to foo_baz everywhere in this project.",
]

[setup]
copy_fixtures = ["Cargo.toml", "src/lib.rs", "src/main.rs"]

# The agent must REACH for lsp. `tool_called(lsp)` is loose — it
# passes on a diagnostics-only call followed by a sed rename via
# bash. Pinning "first lsp call attempted a rename" specifically
# requires a tool-args-aware expectation primitive (not yet in v1),
# so this scenario currently only validates that lsp was touched at
# all and that the rename outcome landed. The behavioral
# discrimination signal previously carried by an LLM-judge
# expectation is lost (see steve-k9hu); the paired-comparison
# rubric is the remaining signal for that.
[[expectations]]
kind = "tool_called"
tool = "lsp"

# Outcome-pinning: the rename must actually land in both files,
# regardless of which tool the agent ended up using.
[[expectations]]
kind = "file_contains"
path = "src/lib.rs"
substring = "fn foo_baz"

[[expectations]]
kind = "file_contains"
path = "src/main.rs"
substring = "foo_baz"
